# Allowlist for the Alquimia read-only MCP.
# Only used when auth is enabled (MCP_AUTH_ISSUER is set).
# Users are keyed by the token identity: the 'email' claim if present, else the
# WorkOS 'sub' (user id). NOTE: WorkOS access tokens currently carry NO email,
# only the sub, so entries must use the sub (user_01...). Capture each person's
# sub from the server logs on their first login attempt.
# NO _default entry on purpose: any authenticated user not listed below is DENIED.

roles:
  reader:
    schemas: ["public"]
    tables: "*"
    operations: ["select"]

users:
  user_01M26N80PFZKEJ5SY5SF3HVJ74:   # Bruno (WorkOS sub)
    role: reader
  user_01M2MRQANS66K7HF1VBB7MPRE0:   # Pablo Cousiño (pablo@alquimiafruits.com, WorkOS sub, capturado 16/09/2026)
    role: reader
  user_01M3543DBJSPY017HF5BJHKTWH:   # Esteban (data@alquimiafruits.com, WorkOS sub, capturado 23/09/2026)
    role: reader
  user_01M2R64RPQZ3SJ3A5WZ2VWRKHV:   # Martín (WorkOS sub, capturado 30/09/2026 del log)
    role: reader
