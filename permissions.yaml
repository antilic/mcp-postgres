# Allowlist for the Alquimia read-only MCP.
# Only used when auth is enabled (MCP_AUTH_ISSUER is set).
# Users are keyed by the 'email' claim (falls back to 'sub' if no email in token).
# NO _default entry on purpose: any authenticated user not listed below is DENIED.

roles:
  reader:
    schemas: ["public"]
    tables: "*"
    operations: ["select"]

users:
  bcippitelli@gmail.com:
    role: reader
